name: basalt image

# Builds the container image for Basalt (github.com/jesdga95/basalt) from its own Dockerfile, at its latest release tag,
# and pushes it to GHCR as <version> and latest. Runs daily; a tag whose image is already published is skipped.
# workflow_dispatch builds a given tag, or rebuilds one that exists with `force`.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Basalt tag to build (v0.4.1). Empty: the latest release."
        required: false
        type: string
      force:
        description: "Build and push even if the image tag already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: basalt-image
  cancel-in-progress: false

env:
  UPSTREAM: jesdga95/basalt
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      latest: ${{ steps.tag.outputs.latest }}
      image: ${{ steps.tag.outputs.image }}
      build: ${{ steps.exists.outputs.build }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          tag=${INPUT_TAG:-$latest_tag}
          if [[ ! "$tag" =~ ^v?[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a version tag: $tag"
            exit 1
          fi
          gh api "repos/$UPSTREAM/git/ref/tags/$tag" --silent || { echo "::error::$UPSTREAM has no tag $tag"; exit 1; }
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "latest=$([[ "$tag" == "$latest_tag" ]] && echo true || echo false)"
            echo "image=$REGISTRY/${OWNER,,}/basalt"
          } >> "$GITHUB_OUTPUT"
          echo "Basalt $tag (latest release: $latest_tag)"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for an existing image
        id: exists
        env:
          REF: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            if [[ "$FORCE" == "true" ]]; then
              echo "$REF exists; rebuilding (force)"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "$REF exists; nothing to build"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "$REF not found; building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      IMAGE: ${{ needs.check.outputs.image }}
    steps:
      # The CUDA devel base and the build tree need more room than a runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Image tags
        id: meta
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          set -euo pipefail
          tags="$IMAGE:$VERSION"
          [[ "$LATEST" == "true" ]] && tags+=",$IMAGE:latest"
          {
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # org.opencontainers.image.source links the package to this repository, so later runs can push to it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=basalt
            org.opencontainers.image.description=Basalt local LLM inference engine for NVIDIA Blackwell, built from its own Dockerfile
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
